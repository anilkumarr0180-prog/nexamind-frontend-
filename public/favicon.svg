<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Radial Bloom -->
    <radialGradient id="fav-glow" cx="16" cy="16" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Energy Pillar -->
    <linearGradient id="fav-left" x1="6" y1="25" x2="15" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Diagonal Quantum Bridge -->
    <linearGradient id="fav-bridge" x1="10" y1="7" x2="22" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="75%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Right Ascending Pillar -->
    <linearGradient id="fav-right" x1="18" y1="25" x2="26" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Dark container background with rounded squircle for tab contrast -->
  <rect width="32" height="32" rx="8" fill="#0e101f"/>
  <rect width="32" height="32" rx="8" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>

  <!-- Core Glow -->
  <circle cx="16" cy="16" r="13" fill="url(#fav-glow)"/>

  <!-- Left Pillar -->
  <path d="M8 24V10.5C8 8.567 9.567 7 11.5 7C13.433 7 15 8.567 15 10.5V19.5" stroke="url(#fav-left)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Diagonal Nexus Bridge -->
  <path d="M11.5 7.5L20.5 24.5" stroke="url(#fav-bridge)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Right Pillar -->
  <path d="M17 12.5V21.5C17 23.433 18.567 25 20.5 25C22.433 25 24 23.433 24 21.5V8" stroke="url(#fav-right)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Cognitive Synapse Spark -->
  <path d="M16 11.5C16 13.9 14.1 16 11.7 16C14.1 16 16 18.1 16 20.5C16 18.1 17.9 16 20.3 16C17.9 16 16 13.9 16 11.5Z" fill="#ffffff"/>
  <circle cx="16" cy="16" r="1.3" fill="#38bdf8"/>
</svg>